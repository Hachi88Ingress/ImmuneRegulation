<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingress 免疫時間予測</title>
<style>
:root { color-scheme: light dark; --line: #8885; --panel: #8881; }
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; margin: 0 auto; padding: 18px; max-width: 760px; line-height: 1.5; }
h1 { font-size: 1.45rem; margin: 0 0 8px; }
.sub { opacity: .8; margin: 0 0 18px; }
.panel { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
label { display: block; font-weight: 650; margin: 12px 0 5px; }
input, select, button { font: inherit; width: 100%; padding: 11px; border-radius: 9px; border: 1px solid var(--line); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
button { margin-top: 16px; cursor: pointer; font-weight: 700; }
table { border-collapse: collapse; width: 100%; margin-top: 10px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 7px; border-bottom: 1px solid var(--line); }
th { font-size: .9rem; }
.blue { color: #2589ff; font-weight: 750; }
.green { color: #22a06b; font-weight: 750; }
.note { font-size: .92rem; opacity: .85; }
.result-head { font-size: 1.05rem; font-weight: 750; }
.error { color: #d44; }
.timeline-scroll { overflow-x: auto; margin-top: 12px; }
.timeline-scroll svg { display: block; max-width: none; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } th, td { padding: 8px 4px; font-size: .9rem; } }
</style>
</head>
<body>
<h1>Ingress 免疫時間予測</h1>
<p class="sub">Cygnus Shard Storm — Portal Immunity Instability</p>

<section class="panel">
  <label for="lastFlip">前回の免疫付与（反転）時刻</label>
  <input id="lastFlip" type="time" step="60">
  <div class="grid">
    <div>
      <label for="color">現在のポータルの色</label>
      <select id="color">
        <option value="blue">青（Resistance）</option>
        <option value="green">緑（Enlightened）</option>
      </select>
    </div>
    <div>
      <label for="duration">現在の免疫保持時間（分）</label>
      <input id="duration" type="number" min="5" max="60" step="1" value="20">
    </div>
  </div>
  <label for="count">予測する反転回数</label>
  <select id="count">
    <option value="6" selected>6回</option>
    <option value="12">12回</option>
    <option value="24">24回</option>
    <option value="48">48回</option>
  </select>
  <button id="calculate">予測を更新</button>
  <p id="error" class="error" role="alert"></p>
</section>

<section class="panel" id="summary" aria-live="polite">
  入力すると予測結果が表示されます。
</section>
<section class="panel">
  <div class="result-head">時間ごとのポータルの色</div>
  <div class="timeline-scroll">
    <svg id="timeline" role="img" aria-label="免疫時間ごとのポータルの色の予測"></svg>
  </div>
</section>
<section class="panel">
  <div class="result-head">反転予測一覧</div>
  <div style="overflow-x:auto">
    <table>
      <thead><tr><th>回数</th><th>予測時刻</th><th>反転後の色</th><th>前回から</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
<p class="note">注意：公式ルールでは免疫保持時間は約30分ごとに変更され、次の時間は事前に分かりません。この一覧は、入力した分数が継続し、免疫切れのたびに必ず反転するという仮定に基づく試算です。現実の反転時刻・色を保証するものではありません。</p>

<script>
const $ = id => document.getElementById(id);
function fmt(d) {
  return new Intl.DateTimeFormat('ja-JP', {
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', weekday:'short',
    hour12:false
  }).format(d);
}
function fmtTime(d) {
  return new Intl.DateTimeFormat('ja-JP', {
    hour:'2-digit', minute:'2-digit', hour12:false
  }).format(d);
}
function renderTimeline(last, mins, n, currentColor) {
  const svg = $('timeline');
  const namespace = 'http://www.w3.org/2000/svg';
  const cellWidth = 100;
  const width = n * cellWidth;
  svg.setAttribute('viewBox', `0 0 ${width} 82`);
  svg.setAttribute('width', width);
  svg.setAttribute('height', 82);
  svg.setAttribute('aria-label', `前回の反転から${n}回目までの色の予測`);
  svg.replaceChildren();
  for (let i = 0; i < n; i++) {
    const x = i * cellWidth;
    const isBlue = (currentColor === 'blue') === (i % 2 === 0);
    const color = isBlue ? '#2589ff' : '#22a06b';
    const label = isBlue ? '青' : '緑';
    const rect = document.createElementNS(namespace, 'rect');
    rect.setAttribute('x', x + 2);
    rect.setAttribute('y', 8);
    rect.setAttribute('width', cellWidth - 4);
    rect.setAttribute('height', 42);
    rect.setAttribute('rx', 3);
    rect.setAttribute('fill', color);
    svg.appendChild(rect);
    const colorText = document.createElementNS(namespace, 'text');
    colorText.setAttribute('x', x + cellWidth / 2);
    colorText.setAttribute('y', 35);
    colorText.setAttribute('text-anchor', 'middle');
    colorText.setAttribute('fill', '#fff');
    colorText.setAttribute('font-size', '16');
    colorText.setAttribute('font-weight', '700');
    colorText.textContent = label;
    svg.appendChild(colorText);
  }
  for (let i = 0; i <= n; i++) {
    const x = i * cellWidth;
    const boundary = new Date(last.getTime() + mins * 60000 * i);
    const tick = document.createElementNS(namespace, 'line');
    tick.setAttribute('x1', x);
    tick.setAttribute('x2', x);
    tick.setAttribute('y1', 4);
    tick.setAttribute('y2', 54);
    tick.setAttribute('stroke', 'currentColor');
    tick.setAttribute('stroke-opacity', '.5');
    svg.appendChild(tick);
    const timeText = document.createElementNS(namespace, 'text');
    timeText.setAttribute('x', i === 0 ? x + 3 : i === n ? x - 3 : x);
    timeText.setAttribute('y', 74);
    timeText.setAttribute('text-anchor', i === 0 ? 'start' : i === n ? 'end' : 'middle');
    timeText.setAttribute('fill', 'currentColor');
    timeText.setAttribute('font-size', '12');
    timeText.textContent = fmtTime(boundary);
    svg.appendChild(timeText);
  }
}
function run() {
  $('error').textContent = '';
  $('rows').innerHTML = '';
  const raw = $('lastFlip').value;
  const mins = Number($('duration').value);
  const n = Number($('count').value);
  if (!raw) { $('error').textContent = '前回の免疫付与時刻を入力してください。'; return; }
  if (!Number.isInteger(mins) || mins < 5 || mins > 60) {
    $('error').textContent = '免疫保持時間は5〜60分の整数で入力してください。'; return;
  }
  const [hours, minutes] = raw.split(':').map(Number);
  if (!Number.isInteger(hours) || !Number.isInteger(minutes)) {
    $('error').textContent = '時刻を確認してください。'; return;
  }
  const now = new Date();
  const last = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0, 0);
  if (last > now) last.setDate(last.getDate() - 1);
  if (Number.isNaN(last.getTime())) { $('error').textContent = '時刻を確認してください。'; return; }
  const elapsed = (now - last) / 60000;
  const remaining = mins - elapsed;
  const currentColor = $('color').value;
  const currentLabel = currentColor === 'blue' ? '青（Resistance）' : '緑（Enlightened）';
  const first = new Date(last.getTime() + mins * 60000);
  const isPast = first <= now;
  renderTimeline(last, mins, n, currentColor);
  $('summary').innerHTML =
    `<div>入力された前回の反転：<strong>${fmt(last)}</strong></div>` +
    `<div>現在の色：<strong class="${currentColor}">${currentLabel}</strong></div>` +
    `<div>仮定する免疫保持時間：<strong>${mins}分</strong></div>` +
    `<div style="margin-top:10px">${isPast
      ? `計算上の次回免疫切れは <strong>${fmt(first)}</strong> です。すでに経過しています。入力した保持時間が一定なら、次の反転予測は過去の時刻から積み上げて表示されます。`
      : `次回の免疫切れ予測：<strong>${fmt(first)}</strong>（あと約${Math.ceil(remaining)}分）`}</div>`;
  let color = currentColor;
  for (let i = 1; i <= n; i++) {
    const at = new Date(last.getTime() + mins * 60000 * i);
    color = color === 'blue' ? 'green' : 'blue';
    const label = color === 'blue' ? '青（Resistance）' : '緑（Enlightened）';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i}</td><td>${fmtTime(at)}</td><td class="${color}">${label}</td><td>${mins}分</td>`;
    $('rows').appendChild(tr);
  }
}
$('calculate').addEventListener('click', run);
$('lastFlip').value = (() => {
  const d = new Date(Date.now() - 20 * 60000);
  const pad = x => String(x).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
})();
run();
</script>
</body>
</html>
